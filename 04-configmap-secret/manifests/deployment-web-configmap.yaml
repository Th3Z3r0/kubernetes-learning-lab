apiVersion: apps/v1
kind: Deployment

metadata:
  name: web
  namespace: myk8s

spec:
  replicas: 3

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html

      volumes:
        - name: web-content
          configMap:
            name: web-content
